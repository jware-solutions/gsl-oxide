[workspace]
members = ["crates/special", "crates/integration", "crates/statistics"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Genaro Camele"]
repository = "https://github.com/jware-solutions/gsl-oxide"
readme = "README.md"
include = ["Cargo.toml", "src/**", "tests/**"]
# The final license for the new Rust implementation is still undecided.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
